<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjeta · Tienda de Vuelo</title>
  <meta name="description" content="Tarjeta de presentación digital de Tienda de Vuelo: WhatsApp, Instagram, web y contacto para guardar en tu teléfono.">
  <meta name="theme-color" content="#0c2340">
  <link rel="canonical" href="https://www.tiendadevuelo.com.ar/tarjeta">
  <meta property="og:title" content="Tienda de Vuelo · Pilot shop">
  <meta property="og:description" content="Auriculares, radios y aviónica originales para pilotos. Guardá nuestro contacto.">
  <meta property="og:image" content="https://www.tiendadevuelo.com.ar/og.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #0c2340, #12406e 60%, #0e8be0); font: 15px/1.45 Inter, Arial, sans-serif; color: #0c2340; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .tarjeta { width: 100%; max-width: 400px; background: #fff; border-radius: 22px; padding: 28px 22px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.3); text-align: center; }
    .tarjeta > img { width: 76px; height: 76px; }
    h1 { font: 700 28px/1.1 Outfit, sans-serif; margin: 10px 0 2px; }
    .sub { color: #0b6fb5; letter-spacing: .3em; font-weight: 600; font-size: 11px; margin: 0 0 10px; }
    .lead { margin: 0 0 18px; color: #3d5470; }
    .sello { display: inline-block; background: #eef6fd; color: #0c2340; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; margin-bottom: 18px; }
    .botones { display: grid; gap: 10px; }
    .botones a, .botones button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border-radius: 14px; font: 600 15px Inter, sans-serif; text-decoration: none; border: 1.5px solid #dbe7f3; background: #fff; color: #0c2340; cursor: pointer; }
    .botones .wa { background: #0d7a3e; border-color: #0d7a3e; color: #fff; }
    .botones .guardar { background: #0c2340; border-color: #0c2340; color: #fff; }
    .qr { margin: 20px auto 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .qr #qr img, .qr #qr canvas { width: 150px !important; height: 150px !important; }
    .qr p { margin: 0; font-size: 13px; color: #3d5470; }
    .pie { display: flex; justify-content: center; gap: 14px; margin-top: 12px; font-size: 13px; }
    .pie a, .pie button { color: #0b6fb5; background: none; border: 0; font: inherit; cursor: pointer; text-decoration: underline; padding: 0; }
    @media print { body { background: #fff; } .tarjeta { box-shadow: none; border: 1px solid #dbe7f3; } .botones, .pie { display: none; } }
  </style>
</head>
<body>
  <main class="tarjeta">
    <img src="/logo.svg" alt="Logo de Tienda de Vuelo">
    <h1>Tienda de Vuelo</h1>
    <p class="sub">PILOT SHOP</p>
    <p class="lead">Auriculares, radios y aviónica originales para pilotos. Envíos a todo el país.</p>
    <span class="sello" id="sello">✔ Distribuidor oficial Bose</span>
    <div class="botones">
      <a class="wa" id="wa" href="#" target="_blank" rel="noopener">💬 WhatsApp <span id="waNum"></span></a>
      <a class="guardar" href="/tienda-de-vuelo.vcf" download="Tienda de Vuelo.vcf">👤 Guardar contacto</a>
      <a id="web" href="/">🛩️ Ver el catálogo</a>
      <a id="ig" href="#" target="_blank" rel="noopener">📷 Instagram</a>
      <a id="mail" href="#">✉️ <span id="mailTxt"></span></a>
      <button type="button" id="compartir" hidden>↗ Compartir tarjeta</button>
    </div>
    <div class="qr"><div id="qr"></div><p>Escaneá para guardar esta tarjeta</p></div>
    <div class="pie"><button type="button" onclick="window.print()">Imprimir</button><a href="/">tiendadevuelo.com.ar</a></div>
  </main>
  <script src="/products.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    $("#wa").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("¡Hola! Te escribo desde la tarjeta de Tienda de Vuelo.")}`;
    $("#waNum").textContent = CONFIG.whatsappVisible;
    $("#ig").href = `https://www.instagram.com/${CONFIG.instagram}`;
    $("#ig").textContent = `📷 @${CONFIG.instagram}`;
    $("#mail").href = `mailto:${CONFIG.email}`;
    $("#mailTxt").textContent = CONFIG.email;
    $("#sello").textContent = `✔ Distribuidor oficial Bose · ${CONFIG.ventas} ventas`;
    const url = CONFIG.sitio + "/tarjeta";
    if (window.QRCode) { new QRCode($("#qr"), { text: url, width: 256, height: 256, colorDark: "#0c2340", colorLight: "#ffffff" }); $("#qr").setAttribute("role", "img"); $("#qr").setAttribute("aria-label", "Código QR de la tarjeta"); $("#qr").querySelectorAll("img, canvas").forEach((x) => x.setAttribute("alt", "")); setTimeout(() => $("#qr").querySelectorAll("img").forEach((x) => x.setAttribute("alt", "")), 50); }
    if (navigator.share) {
      $("#compartir").hidden = false;
      $("#compartir").onclick = () => navigator.share({ title: "Tienda de Vuelo", text: "Pilot shop: auriculares, radios y aviónica originales.", url }).catch(() => {});
    }
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
