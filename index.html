<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda de Vuelo</title>
  <meta name="description" content="Equipamiento aeronáutico para pilotos y tripulantes.">
  <style>
    :root { --bg: #f5f7fb; --fg: #0f1b2d; --muted: #5b6b82; --accent: #1d5fd1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --fg: #e8eef8; --muted: #9aa8bd; --accent: #6ea3ff; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    .icon { font-size: 56px; }
    h1 { font-size: clamp(32px, 7vw, 52px); margin: 16px 0 8px; letter-spacing: -0.02em; }
    p { color: var(--muted); font-size: 18px; max-width: 32ch; margin: 0 auto; line-height: 1.5; }
    .tag { display: inline-block; margin-top: 24px; padding: 8px 16px; border-radius: 999px;
      border: 1px solid var(--accent); color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="icon">✈️</div>
    <h1>Tienda de Vuelo</h1>
    <p>Equipamiento aeronáutico para pilotos y tripulantes.</p>
    <span class="tag">Muy pronto</span>
  </main>
</body>
</html>
